spring:

  mail:
    host: smtp.gmail.com
    port: 587
    username: "email"
    password: "password"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  batch:
    job:
      enabled: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  application:
    name: mopl

  config:
    activate:
      on-profile: test-dm
    import: optional:file:${user.dir}/.env[.properties]
  cloud:
    aws:
      credentials:
        access-key: ${AWS_S3_ACCESS_KEY:aaa}
        secret-key: ${AWS_S3_SECRET_KEY:aaa}
      region:
        static: ${AWS_REGION:ap-northeast-2}
      s3:
        bucket: ${AWS_S3_BUCKET:aaa}
        presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:PT10H}

  jpa:
    hibernate:
      ddl-auto: none
    show_sql: true
    properties:
      hibernate:
        format_sql: true
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 100
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER:localhost:9092}
    consumer:
      group-id: notification-group-v1

    #캐시용 설정
  data:
    redis:
      host: "host"
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1s
      connect-timeout: 2s
      database: 0
  security:
    oauth2:
      client:
         registration:
           google:
            client-id: "id"
            client-secret: "secret"
            scope:
                - email
                - profile
           kakao:
            client-id: "key"
            client-secret: "secret"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope:
                - profile_nickname
            client-name: mopl
         provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

logging:
  level:
    org.example.mopl: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: trace

sse:
  timeout: 3600000

content:
  api:
    tmdb:
      key: "1111111111111111111111111111111111111111111111111111111111111111"
      url: https://api.themoviedb.org/3
      all-pages: 5
    thesportsdb:
      key: "111111111111111111111111111111111111111111111111111111111"
      url: https://www.thesportsdb.com/api/v1/json

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
jwt:
  secret: "1111111111111111111111111111111111111111111111111111111111111111"
  access_key_expiration: 600000
  refresh_key_expiration: 1209600000
  issuer: "mopl-server"