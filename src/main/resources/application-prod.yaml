server:
  port: ${SERVER_PORT:80}
  shutdown: graceful # 운영 환경에서는 안전한 종료를 위해 권장합니다.

spring:
  application:
    name: mopl-service # Metric 태그 등에 사용됩니다.

  cloud:
    aws:
      credentials:
        access-key: ${AWS_S3_ACCESS_KEY}
        secret-key: ${AWS_S3_SECRET_KEY}
      region:
        static: ${AWS_REGION:ap-northeast-2}
      s3:
        bucket: ${AWS_S3_BUCKET}
        presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:PT10H}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none # 운영 환경에서는 반드시 none 또는 validate
    show_sql: ${JPA_SHOW_SQL:false} # 운영 중 쿼리 확인이 필요할 때만 켭니다.
    properties:
      hibernate:
        format_sql: true
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: ${HIBERNATE_BATCH_SIZE:100}

  Kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:notification-group-v1}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:1s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_SECRET}
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_KEY}
            client-secret: ${KAKAO_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope:
              - profile_nickname
            client-name: mopl
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

logging:
  level:
    root: info
    org.example.mopl: ${LOGGING_LEVEL_APP:info}
    org.hibernate.SQL: ${LOGGING_LEVEL_SQL:info}
    org.hibernate.orm.jdbc.bind: ${LOGGING_LEVEL_BIND:info}
    org.springframework.security: ${LOGGING_LEVEL_SECURITY:info}

sse:
  timeout: ${SSE_TIMEOUT:3600000}

content:
  api:
    tmdb:
      key: ${CONTENT_API_TMDB_KEY}
      url: https://api.themoviedb.org/3
      all-pages: ${TMDB_ALL_PAGES:5}
    thesportsdb:
      key: ${CONTENT_API_THESPORTSDB_KEY}
      url: https://www.thesportsdb.com/api/v1/json

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSURE:health,prometheus,metrics}