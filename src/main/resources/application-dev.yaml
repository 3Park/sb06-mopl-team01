server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mopl
    driver-class-name: org.postgresql.Driver
    username: mopl
    password: 1234
  jpa:
    hibernate:
      ddl-auto: create
    show_sql: true
    properties:
      hibernate:
        format_sql: true


logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: trace