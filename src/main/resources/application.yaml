spring:
  flyway:
    baseline-on-migrate: true
  application:
    name: mopl
  profiles:
    active:
      - dev
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_ADDRESS}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  batch:
    job:
      enabled: false
jwt:
  secret: ${JWT_SECRET_KEY}
  access_key_expiration: 600000
  refresh_key_expiration: 1209600000
  issuer: "mopl-server"
