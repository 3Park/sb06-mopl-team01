name: deploy.yml

on:
  workflow_dispatch:
    branches:
      - main
      - Develop
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
  push:
    branches:
      - Develop

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  ECS_TASK_FAMILY: ${{ secrets.ECS_TASK_FAMILY }}
  ECS_CONTAINER_NAME: ${{ secrets.ECS_CONTAINER_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build application
        run: ./gradlew bootJar -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin 579035299525.dkr.ecr.ap-northeast-2.amazonaws.com
          
      - name: Set image metadata
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE_URI }} .
          docker push ${{ env.IMAGE_URI }}

      - name: Update ECS task definition
        env:
          AWS_REGION: ap-northeast-2
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}
          ECS_TASK_FAMILY: ${{ env.ECS_TASK_FAMILY }}
          ECS_CONTAINER_NAME: ${{ env.ECS_CONTAINER_NAME }}
          IMAGE_URI: ${{ env.IMAGE_URI }}
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          
          TASK_DEFINITION=$(aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_FAMILY }} --query 'taskDefinition' --output json)

          UPDATED_TASK_DEFINITION=$(echo "$TASK_DEFINITION" | jq \
            --arg IMAGE_URI "${{ env.IMAGE_URI }}" \
            '.containerDefinitions[0].image = $IMAGE_URI | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json "$(echo "$UPDATED_TASK_DEFINITION" | jq -c '.')" --query 'taskDefinition.taskDefinitionArn' --output text)
          
          echo "NEW_TASK_DEF_ARN=${NEW_TASK_DEF_ARN}" >> "${GITHUB_ENV}"

      - name: Update ECS service
        env:
          AWS_REGION: ap-northeast-2
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}
          ECS_SERVICE: ${{ env.ECS_SERVICE }}
          ECS_TASK_FAMILY: ${{ env.ECS_TASK_FAMILY }}
          ECS_CONTAINER_NAME: ${{ env.ECS_CONTAINER_NAME }}
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ env.NEW_TASK_DEF_ARN }} \
            --force-new-deployment

